<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Wild West — 3D westernová hra zdarma v prohlížeči</title>
  <meta name="description" content="Wild West je česká 3D westernová hra, kterou hraješ přímo v prohlížeči zdarma a bez instalace. Prozkoumej městečko na Divokém západě, plň úkoly pro šerifa i Mary, kupuj koně a odhal tajemství pod kostelem." />
  <meta name="author" content="austy" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#3e2723" />
  <link rel="canonical" href="https://austy246.github.io/wild-west/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wild West" />
  <meta property="og:locale" content="cs_CZ" />
  <meta property="og:url" content="https://austy246.github.io/wild-west/" />
  <meta property="og:title" content="Wild West — 3D westernová hra zdarma v prohlížeči" />
  <meta property="og:description" content="Česká 3D westernová hra do prohlížeče. Úkoly, souboje, koně a tajemství pod kostelem — zdarma a bez instalace." />
  <meta property="og:image" content="https://austy246.github.io/wild-west/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wild West — 3D westernová hra zdarma v prohlížeči" />
  <meta name="twitter:description" content="Česká 3D westernová hra do prohlížeče. Úkoly, souboje, koně a tajemství pod kostelem — zdarma a bez instalace." />
  <meta name="twitter:image" content="https://austy246.github.io/wild-west/og-image.png" />

  <!-- Structured data so search engines know this is a playable game -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Wild West",
    "url": "https://austy246.github.io/wild-west/",
    "description": "Česká 3D westernová hra, kterou hraješ přímo v prohlížeči zdarma a bez instalace.",
    "inLanguage": "cs",
    "genre": ["Akční hra", "Adventura", "Western"],
    "gamePlatform": "Webový prohlížeč",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "author": { "@type": "Person", "name": "austy" },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CZK" }
  }
  </script>

  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/hud.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- HUD Overlay -->
  <div id="hud" class="hidden">
    <div id="health-bar">
      <div id="health-bar-fill"></div>
      <span id="health-text">100 / 100</span>
    </div>
    <div id="hunger-bar">
      <div id="hunger-bar-fill"></div>
      <span id="hunger-text">100 / 100</span>
    </div>
    <div id="stamina-bar">
      <div id="stamina-bar-fill"></div>
      <span id="stamina-text">100 / 100</span>
    </div>
    <div id="lilky-counter">
      <span id="lilky-icon">&#9733;</span>
      <span id="lilky-amount">0</span>
    </div>
    <div id="weapon-indicator">
      <span id="weapon-name">Pěsti</span>
    </div>

    <!-- Minecraft-style hotbar (5 slots) -->
    <div id="hotbar">
      <div class="hotbar-slot selected" data-slot="0"><span class="hotbar-key">1</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="1"><span class="hotbar-key">2</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="2"><span class="hotbar-key">3</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="3"><span class="hotbar-key">4</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="4"><span class="hotbar-key">5</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="5"><span class="hotbar-key">6</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
      <div class="hotbar-slot" data-slot="6"><span class="hotbar-key">7</span><div class="hotbar-item"></div><span class="hotbar-count"></span></div>
    </div>
  </div>

  <!-- Fade transition overlay -->
  <div id="fade-overlay"></div>

  <!-- Build version, filled in from src/version.ts -->
  <div id="version-tag"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
